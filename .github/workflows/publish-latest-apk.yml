name: Publish latest APK

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Télécharger l'artefact du build
        uses: actions/download-artifact@v4
        with:
          name: NicoBudget-debug-apk
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Préparer l'APK
        run: |
          set -e
          APK=$(find artifact -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" NicoBudget-latest-debug.apk
          ls -lh NicoBudget-latest-debug.apk

      - name: Publier l'APK latest-debug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if gh release view latest-debug --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest-debug NicoBudget-latest-debug.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest-debug NicoBudget-latest-debug.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --title "NicoBudget - dernière build de test" \
              --notes "APK debug automatiquement publié après un build réussi." \
              --prerelease
          fi

      - name: Enregistrer le dernier build réussi
        run: |
          cat > latest-build.txt <<EOF
          run_id=${{ github.event.workflow_run.id }}
          run_number=${{ github.event.workflow_run.run_number }}
          head_sha=${{ github.event.workflow_run.head_sha }}
          artifact=NicoBudget-debug-apk
          release_asset=https://github.com/${{ github.repository }}/releases/download/latest-debug/NicoBudget-latest-debug.apk
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-build.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update latest APK build marker [skip ci]"
            git push origin HEAD:main
          fi

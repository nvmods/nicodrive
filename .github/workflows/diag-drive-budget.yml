name: Diagnose Drive Budget
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Drive budget integration
        shell: bash
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          unzip -o -q "$ZIP" -d projet
          echo '===== DriveImporter ====='
          sed -n '1,260p' projet/app/src/main/java/com/example/nicobudget/drive/DriveImporter.kt || true
          echo '===== Expense entities / dao ====='
          grep -RIn -A40 -B10 -E 'data class ExpenseEntity|interface ExpenseDao|fun addExpense|insertExpense|get.*Expense|weekly|Week' projet/app/src/main/java/com/example/nicobudget/data projet/app/src/main/java/com/example/nicobudget/drive | head -700 || true
          echo '===== BudgetViewModel budget functions ====='
          VM=$(grep -RIl 'class BudgetViewModel' projet/app/src/main/java | head -1)
          echo "$VM"
          grep -n -A35 -B15 -E 'calculateCurrentWeekBudget|updateDisposableLeftover|addExpense|weekly|week|Expense' "$VM" | head -900 || true

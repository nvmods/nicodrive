name: Diagnose Drive Dashboard
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Drive ViewModel
        shell: bash
        run: |
          set -e
          ZIP=$(ls *.zip | head -1)
          unzip -o -q "$ZIP" -d projet
          echo '===== BudgetViewModel files ====='
          grep -RIl 'class BudgetViewModel' projet/app/src/main/java | while IFS= read -r f; do
            echo "----- $f -----"
            grep -n -A8 -B4 -E 'getDrive(Month|Top|Section|Product)|driveOrderDao|class BudgetViewModel' "$f" || true
          done
          echo '===== Drive models ====='
          grep -RIn -A8 -B2 -E 'data class DriveMonthlyTotal|data class DriveTopProduct|data class CategoryExpenseTotal|data class DriveProductStat' projet/app/src/main/java || true

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le zip du projet
        run: |
          echo "===== Racine du repo ====="
          ls -la
          ZIP=$(ls *.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun zip trouvé à la racine du repo."
            exit 1
          fi
          echo "Extraction de : $ZIP"
          unzip -o -q "$ZIP" -d projet

      - name: Localiser le projet
        id: locate
        run: |
          SETTINGS=$(find projet -maxdepth 3 -name "settings.gradle.kts" -not -path "*/build/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle.kts introuvable dans le zip."
            find projet -maxdepth 2 -type d
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Projet trouvé dans : $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Appliquer la récupération Leclerc authentifiée
        run: |
          DIR="${{ steps.locate.outputs.dir }}"
          SYNC_TARGET="$DIR/app/src/main/java/com/example/nicobudget/drive/DriveMailSync.kt"
          SCREEN_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/DriveScreen.kt"
          SESSION_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/LeclercSessionDialog.kt"

          test -f fixes/DriveMailSync.kt || { echo "fixes/DriveMailSync.kt introuvable"; exit 1; }
          test -f fixes/LeclercSessionDialog.kt || { echo "fixes/LeclercSessionDialog.kt introuvable"; exit 1; }
          test -f "$SYNC_TARGET" || { echo "DriveMailSync.kt introuvable dans le ZIP"; exit 1; }
          test -f "$SCREEN_TARGET" || { echo "DriveScreen.kt introuvable dans le ZIP"; exit 1; }

          cp fixes/DriveMailSync.kt "$SYNC_TARGET"
          cp fixes/LeclercSessionDialog.kt "$SESSION_TARGET"

          # La session WebView est la source la plus fidèle après le reCAPTCHA.
          # On garde les cookies chiffrés en secours, mais le téléchargement HTTP
          # consulte aussi directement le CookieManager Android du WebView.
          python3 - "$SYNC_TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          alias_import = 'import android.webkit.CookieManager as WebCookieManager\n'
          if alias_import not in text:
              marker = 'import android.content.Context\n'
              if marker not in text:
                  raise SystemExit('Import Context introuvable dans DriveMailSync')
              text = text.replace(marker, marker + alias_import, 1)

          helper_marker = '    private fun browserCookieFor(context: Context, url: String): String? {'
          live_helper = '''    private fun liveWebViewCookieFor(url: String): String? = try {
              WebCookieManager.getInstance().getCookie(url)
                  ?.takeIf { it.isNotBlank() }
          } catch (_: Exception) {
              null
          }

          '''
          if 'private fun liveWebViewCookieFor(' not in text:
              if helper_marker not in text:
                  raise SystemExit('Point insertion liveWebViewCookieFor introuvable')
              text = text.replace(helper_marker, live_helper + helper_marker, 1)

          old_cookie_block = '''            mergedCookieHeader(
              browserCookieFor(context, current),
              requestCookies
          )?.let { conn.setRequestProperty("Cookie", it) }
          '''
          new_cookie_block = '''            val liveWebCookies = liveWebViewCookieFor(current)
          val persistedWebCookies = browserCookieFor(context, current)
          val webCookies = mergedCookieHeader(
              liveWebCookies,
              listOfNotNull(persistedWebCookies)
          )
          mergedCookieHeader(
              webCookies,
              requestCookies
          )?.let { conn.setRequestProperty("Cookie", it) }
          '''
          if old_cookie_block in text:
              text = text.replace(old_cookie_block, new_cookie_block, 1)
          elif 'val liveWebCookies = liveWebViewCookieFor(current)' not in text:
              raise SystemExit('Bloc Cookie HTTP introuvable')

          path.write_text(text, encoding="utf-8")
          PY

          python3 - "$SCREEN_TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          state_marker = '    var autoSync by remember { mutableStateOf(DriveMailSync.isAutoSync(context)) }\n'
          if 'var leclercAuthUrl by remember' not in text:
              if state_marker not in text:
                  raise SystemExit('Point insertion état Leclerc introuvable')
              text = text.replace(
                  state_marker,
                  state_marker + '    var leclercAuthUrl by remember { mutableStateOf<String?>(null) }\n',
                  1
              )

          old_fun = '    fun syncFromMail() {\n'
          new_fun = '    fun syncFromMail(afterLeclercLogin: Boolean = false) {\n'
          if old_fun in text:
              text = text.replace(old_fun, new_fun, 1)
          elif new_fun not in text:
              raise SystemExit('Fonction syncFromMail introuvable')

          old_call = '                    DriveMailSync.sync(context, config)'
          new_call = '                    DriveMailSync.sync(context, config, includeHistorical = true)'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('Appel DriveMailSync.sync introuvable')

          status_marker = '                status = "${report.mailsScanned} mails scannés, " +\n'
          auth_assignment = '''                // Après une connexion WebView on ne rouvre jamais
          // immédiatement la fenêtre si Leclerc refuse encore la requête HTTP :
          // cela évite la boucle connexion -> reprise -> connexion.
          leclercAuthUrl = if (afterLeclercLogin) null else report.authRequiredUrl
          '''
          if 'leclercAuthUrl = if (afterLeclercLogin)' not in text:
              if status_marker not in text:
                  raise SystemExit('Point insertion rapport Leclerc introuvable')
              text = text.replace(status_marker, auth_assignment + status_marker, 1)

          pdf_marker = '                report.pdfs.forEach { file ->\n'
          post_auth_guard = '''                if (afterLeclercLogin && report.authRequiredUrl != null) {
              status = (status ?: "") +
                  "\\nSession E.Leclerc enregistrée, mais le téléchargement est encore protégé. " +
                  "La fenêtre de connexion ne sera pas rouverte en boucle."
          }
          '''
          if 'La fenêtre de connexion ne sera pas rouverte en boucle' not in text:
              if pdf_marker not in text:
                  raise SystemExit('Point insertion garde anti-boucle introuvable')
              text = text.replace(pdf_marker, post_auth_guard + pdf_marker, 1)

          config_marker = '    if (showConfig) {\n'
          dialog_block = '''    leclercAuthUrl?.let { authUrl ->
              LeclercSessionDialog(
                  initialUrl = authUrl,
                  onDismiss = { leclercAuthUrl = null },
                  onSessionSaved = {
                      leclercAuthUrl = null
                      status = "Session E.Leclerc enregistrée. Reprise de l'historique…"
                      syncFromMail(afterLeclercLogin = true)
                  }
              )
          }

          '''
          if 'LeclercSessionDialog(' not in text:
              if config_marker not in text:
                  raise SystemExit('Point insertion dialogue Leclerc introuvable')
              text = text.replace(config_marker, dialog_block + config_marker, 1)

          path.write_text(text, encoding="utf-8")
          PY

          echo "===== Correctifs appliqués ====="
          grep -n -E "liveWebViewCookieFor|liveWebCookies|includeHistorical" "$SYNC_TARGET"
          grep -n -E "afterLeclercLogin|leclercAuthUrl|LeclercSessionDialog" "$SCREEN_TARGET"

      - name: Numero de version unique par build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i "s/versionCode = 100/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"1\\.4-drive\"/versionName = \"1.4-b${{ github.run_number }}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo
          echo "===== ERREURS PRINCIPALES ====="
          grep -nE '(^e: |\[ksp\]|What went wrong|Execution failed|Caused by:|error:)' build.log | head -80 || true
          exit "$STATUS"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoBudget-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

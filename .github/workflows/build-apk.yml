name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le zip du projet
        run: |
          echo "===== Racine du repo ====="
          ls -la
          ZIP=$(ls *.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun zip trouvé à la racine du repo."
            exit 1
          fi
          echo "Extraction de : $ZIP"
          unzip -o -q "$ZIP" -d projet

      - name: Localiser le projet
        id: locate
        run: |
          SETTINGS=$(find projet -maxdepth 3 -name "settings.gradle.kts" -not -path "*/build/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle.kts introuvable dans le zip."
            find projet -maxdepth 2 -type d
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Projet trouvé dans : $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Appliquer le correctif Leclerc Drive
        run: |
          TARGET="${{ steps.locate.outputs.dir }}/app/src/main/java/com/example/nicobudget/drive/DriveMailSync.kt"
          if [ ! -f "fixes/DriveMailSync.kt" ]; then
            echo "ERREUR : fixes/DriveMailSync.kt introuvable."
            exit 1
          fi
          if [ ! -f "$TARGET" ]; then
            echo "ERREUR : DriveMailSync.kt introuvable dans le projet extrait : $TARGET"
            exit 1
          fi

          echo "===== API auto-sync présente dans la v1.4 ====="
          grep -n -C 5 -E 'isAutoSync|setAutoSync|auto_sync' "$TARGET" || true

          cp fixes/DriveMailSync.kt "$TARGET"

          # La v1.4 appelle encore ces deux méthodes depuis MainActivity,
          # DriveSyncWorker et DriveScreen. Le correctif réseau conserve donc
          # explicitement cette API pour rester compatible avec le ZIP actuel.
          python3 - "$TARGET" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          marker = "    private fun loadKeySet(context: Context, key: String): LinkedHashSet<String> {"
          compat = '''    fun isAutoSync(context: Context): Boolean {
              val p = prefs(context)
              return when {
                  p.contains("auto_sync_enabled") -> p.getBoolean("auto_sync_enabled", false)
                  p.contains("auto_sync") -> p.getBoolean("auto_sync", false)
                  else -> false
              }
          }

          fun setAutoSync(context: Context, enabled: Boolean) {
              prefs(context).edit()
                  .putBoolean("auto_sync_enabled", enabled)
                  .putBoolean("auto_sync", enabled)
                  .apply()
          }

          '''
          if "fun isAutoSync(" not in text:
              if marker not in text:
                  raise SystemExit("Point d'insertion auto-sync introuvable")
              text = text.replace(marker, compat + marker, 1)
              path.write_text(text, encoding="utf-8")
          PY

          echo "Correctif appliqué : $TARGET"
          grep -n -E "PREF_PROCESSED_MESSAGES|MAX_RECOVERY_AGE_MS|fun isAutoSync|fun setAutoSync" "$TARGET"

      - name: Numero de version unique par build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i "s/versionCode = 100/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"1\\.4-drive\"/versionName = \"1.4-b${{ github.run_number }}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo
          echo "===== ERREURS PRINCIPALES ====="
          grep -nE '(^e: |\[ksp\]|What went wrong|Execution failed|Caused by:|error:)' build.log | head -80 || true
          exit "$STATUS"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoBudget-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

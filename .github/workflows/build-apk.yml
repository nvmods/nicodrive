name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le zip du projet
        run: |
          echo "===== Racine du repo ====="
          ls -la
          ZIP=$(ls *.zip | head -1)
          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun zip trouvé à la racine du repo."
            exit 1
          fi
          echo "Extraction de : $ZIP"
          unzip -o -q "$ZIP" -d projet

      - name: Localiser le projet
        id: locate
        run: |
          SETTINGS=$(find projet -maxdepth 3 -name "settings.gradle.kts" -not -path "*/build/*" | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle.kts introuvable dans le zip."
            find projet -maxdepth 2 -type d
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Projet trouvé dans : $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Appliquer les correctifs Drive
        run: |
          DIR="${{ steps.locate.outputs.dir }}"
          SYNC_TARGET="$DIR/app/src/main/java/com/example/nicobudget/drive/DriveMailSync.kt"
          IMPORTER_TARGET="$DIR/app/src/main/java/com/example/nicobudget/drive/DriveImporter.kt"
          SCREEN_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/DriveScreen.kt"
          STATS_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/DriveStatsScreen.kt"
          ALL_PRODUCTS_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/AllProductsDialog.kt"
          SESSION_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/LeclercSessionDialog.kt"
          HISTORY_TARGET="$DIR/app/src/main/java/com/example/nicobudget/ui/LeclercHistoryDialog.kt"
          ENTITIES_TARGET="$DIR/app/src/main/java/com/example/nicobudget/data/model/DriveEntities.kt"
          DAO_TARGET="$DIR/app/src/main/java/com/example/nicobudget/data/db/DriveOrderDao.kt"
          VM_TARGET="$DIR/app/src/main/java/com/example/nicobudget/data/model/BudgetViewModel.kt"

          for f in \
            fixes/DriveMailSync.kt \
            fixes/DriveImporter.kt \
            fixes/LeclercSessionDialog.kt \
            fixes/LeclercHistoryDialog.kt \
            fixes/DriveStatsScreen.kt \
            fixes/AllProductsDialog.kt \
            fixes/DriveEntities.kt \
            fixes/DriveOrderDao.kt \
            fixes/patch_project.py \
            fixes/patch_history.py \
            fixes/patch_history_layout.py \
            fixes/patch_drive_dashboard.py \
            fixes/patch_drive_budget.py \
            fixes/patch_all_products_stats.py; do
            test -f "$f" || { echo "$f introuvable"; exit 1; }
          done

          for f in "$SYNC_TARGET" "$IMPORTER_TARGET" "$SCREEN_TARGET" "$STATS_TARGET" "$ENTITIES_TARGET" "$DAO_TARGET" "$VM_TARGET"; do
            test -f "$f" || { echo "$f introuvable dans le ZIP"; exit 1; }
          done

          cp fixes/DriveMailSync.kt "$SYNC_TARGET"
          cp fixes/DriveImporter.kt "$IMPORTER_TARGET"
          cp fixes/LeclercSessionDialog.kt "$SESSION_TARGET"
          cp fixes/LeclercHistoryDialog.kt "$HISTORY_TARGET"
          cp fixes/DriveStatsScreen.kt "$STATS_TARGET"
          cp fixes/AllProductsDialog.kt "$ALL_PRODUCTS_TARGET"
          cp fixes/DriveEntities.kt "$ENTITIES_TARGET"
          cp fixes/DriveOrderDao.kt "$DAO_TARGET"

          python3 fixes/patch_project.py "$DIR"
          python3 fixes/patch_history.py "$DIR"
          python3 fixes/patch_history_layout.py "$DIR"
          python3 fixes/patch_drive_dashboard.py "$DIR"
          python3 fixes/patch_drive_budget.py "$DIR"
          python3 fixes/patch_all_products_stats.py "$DIR"

          echo "===== Vérification correctifs ====="
          grep -n -E "liveWebViewCookieFor|markBrowserLinkProcessed|includeHistorical" "$SYNC_TARGET"
          grep -n -E "belongsToActiveBudgetCycle|reconcileCurrentBudget|hors budget courant" "$IMPORTER_TARGET"
          grep -n -E "leclercAuthUrl|onPdfCaptured|Reconnecter E.Leclerc|Synchroniser l'historique E.Leclerc|LeclercHistoryDialog" "$SCREEN_TARGET"
          grep -n -E "collectHistory|Scanner et importer|bon-de-commande.aspx|ddlFiltreAnnees|lbSuivant|navigationBarsPadding|zIndex" "$HISTORY_TARGET"
          grep -n -E "Historique global|Totaux par année|Dépenses par mois|getDriveTopProductsAll|getDriveTopProductsForYear|Voir tous les produits|FREQUENCY" "$STATS_TARGET" "$VM_TARGET"
          grep -n -E "AllProductsDialog|Fréquence|Rechercher un produit" "$ALL_PRODUCTS_TARGET"
          grep -n -E "getAllOrdersNow|setExpenseId|getTopProductsForYear|getTopProductsAll|getSectionTotalsForYear|getSectionTotalsAll" "$DAO_TARGET"
          grep -n -E "reconcileCurrentBudget" "$VM_TARGET"
          grep -n -E "ticketLeclerc|lineTotal" "$ENTITIES_TARGET" "$DAO_TARGET"

      - name: Numero de version unique par build
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          sed -i "s/versionCode = 100/versionCode = ${{ github.run_number }}/" app/build.gradle.kts
          sed -i -E "s/versionName = \"1\\.4-drive\"/versionName = \"1.4-b${{ github.run_number }}\"/" app/build.gradle.kts
          grep -E "versionCode|versionName" app/build.gradle.kts

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set +e
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          echo
          echo "===== ERREURS PRINCIPALES ====="
          grep -nE '(^e: |\[ksp\]|What went wrong|Execution failed|Caused by:|error:)' build.log | head -80 || true
          exit "$STATUS"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: NicoBudget-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
